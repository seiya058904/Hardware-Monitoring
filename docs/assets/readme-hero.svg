<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Hardware Monitoring</title>
  <desc id="d">A compact overlay card with rows of metric readings, each marked with a status symbol for fresh, degraded, or unavailable data. An illustration of the overlay, not a screenshot.</desc>
  <rect width="1200" height="320" fill="#0b1020"/>
  <path d="M0 304H1200" stroke="#1c2745" stroke-width="2"/>
  <text x="56" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#f1f5f9">Hardware Monitoring</text>
  <text x="58" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#7aa7ff">Know what your PC is doing.</text>
  <path d="M58 250h70l12-18 14 36 12-26 10 8h96" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Overlay card -->
  <rect x="800" y="28" width="330" height="264" rx="16" fill="#121a30" stroke="#2a3a66" stroke-width="2"/>
  <rect x="826" y="50" width="120" height="14" rx="7" fill="#e5ecff"/>
  <circle cx="1088" cy="57" r="8" fill="none" stroke="#7aa7ff" stroke-width="3"/>
  <path d="M826 82H1104" stroke="#2a3a66" stroke-width="2"/>

  <g fill="#8aa0d0">
    <rect x="826" y="104" width="70" height="12" rx="6"/>
    <rect x="826" y="142" width="86" height="12" rx="6"/>
    <rect x="826" y="180" width="64" height="12" rx="6"/>
    <rect x="826" y="218" width="96" height="12" rx="6"/>
    <rect x="826" y="256" width="78" height="12" rx="6"/>
  </g>
  <g fill="#e5ecff">
    <rect x="982" y="104" width="62" height="12" rx="6"/>
    <rect x="968" y="142" width="76" height="12" rx="6"/>
    <rect x="990" y="180" width="54" height="12" rx="6"/>
    <rect x="976" y="218" width="68" height="12" rx="6"/>
  </g>
  <rect x="1004" y="256" width="40" height="12" rx="6" fill="#3a4a78"/>

  <!-- Status marks: fresh (disc), degraded (triangle), unavailable (ring) -->
  <circle cx="1080" cy="110" r="9" fill="#34d399"/>
  <circle cx="1080" cy="148" r="9" fill="#34d399"/>
  <path d="M1080 170l10 18h-20z" fill="#f5a524"/>
  <circle cx="1080" cy="224" r="9" fill="#34d399"/>
  <circle cx="1080" cy="262" r="8" fill="none" stroke="#8aa0d0" stroke-width="3"/>
</svg>
