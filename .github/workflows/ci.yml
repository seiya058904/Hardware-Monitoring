name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime test dependencies
        run: python -m pip install -r requirements-runtime.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py sensor_runtime.py service_runtime.py fps_stream.py fps_sessions.py dashboard_server.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Repository hygiene
        run: git diff --check

  termux-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Termux Python contracts (Linux, not Android device validation)
        run: python -m unittest discover -s android/termux/tests -v
      - name: CLI to supervisor exit and retry contracts
        run: bash android/termux/tests/test_boot.sh
